<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型修复窗口 · 离线界面夹具</title>
  <style>
    body { margin: 0; font: 14px/1.5 sans-serif; color: #303133; background: #fff; }
    main { max-width: 1100px; padding: 16px; margin: auto; min-width: 0; }
    .el-select { max-width: 100%; }
    .el-checkbox { height: auto; white-space: normal; }
    .el-checkbox__label { white-space: normal; }
  </style>
</head>
<body>
  <main><p role="status">离线界面夹具：没有调用模型、爬虫、NAS 或发布。</p><div id="app"></div></main>
  <script type="module">
    import { createApp } from 'vue'
    import ElementPlus from 'element-plus'
    import 'element-plus/dist/index.css'
    import RepairPanel from '../src/RepairPanel.vue'
    import ReleasePlanPanel from '../src/ReleasePlanPanel.vue'

    const mode = new URLSearchParams(location.search).get('mode') || 'full'
    const source = 'class Spider:\n    def homeContent(self, filter):\n        return {"list": []}\n'
    const baseline = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(source))),
      value => value.toString(16).padStart(2, '0')).join('')
    const candidateSha = 'b'.repeat(64)
    const proposalSha = 'd'.repeat(64)
    const repair = {
      id: 'fixture-repair', baselineRunId: 'fixture-run', baselineArtifactSha256: baseline,
      faultSha256: 'c'.repeat(64), status: 'AWAITING_PROPOSAL', stopCode: null,
      usedRounds: 0, maxRounds: 3, freshness: mode === 'stale' ? 'source_changed' : 'current', staleInputs: [],
      frozen: { policy: { scope: 'managed_home_candidate', targetNodes: ['C01', 'C02'] },
        baseline: { context: { boundary: 'data_only', rules: [{ title: 'FIXTURE_REFERENCE',
          excerpt: '<img src=x onerror="window.fixtureInjected=true">' }] } } }
    }
    const proposal = {
      schemaVersion: 1, expectedBaselineSha256: baseline, targetFile: 'source.py',
      diagnosis: 'FIXTURE_HOME_EMPTY', expectedEffect: 'FIXTURE_ONLY',
      validationTargets: ['C01', 'C02'], edits: [{ oldText: '[]', newText: '[{"vod_id":"fixture"}]' }]
    }
    const candidate = {
      id: 'fixture-candidate', roundNumber: 1, sha256: candidateSha, status: 'STATIC_VALIDATED',
      errorCode: null, modelCallId: 'fixture-call', proposal,
      result: { staticValidationPassed: true, publishEligible: false, contractViolations: [],
        pendingRegressionNodes: ['C01', 'C02'], requiredCoverage: { total: 2, pass: 0, fail: 0, notTested: 2 } }
    }
    const state = {
      repair, calls: [], candidates: [], plans: [], writes: [], generations: 0, lost: false, callListReads: 0,
      connection: { enabled: ['retry', 'refresh-error', 'cancel', 'stale'].includes(mode), model: 'offline-ui-fixture',
        configurationSha256: 'e'.repeat(64), maxCompletionTokens: 1024 },
      consent: { sourceId: 'fixture-source', artifactSha256: ['full', 'revoked'].includes(mode) ? null : baseline },
      baseline, candidateSha, proposalSha, changed: false
    }
    const makeCall = key => ({
      id: 'fixture-call', requestKey: key, attemptNumber: 1, modelName: 'offline-ui-fixture',
      status: 'QUEUED', errorCode: null, proposal: null, proposalSha256: null, candidateId: null,
      submissionStatus: 'NOT_REQUESTED', submissionErrorCode: null, usage: null
    })
    const complete = () => Object.assign(state.calls[0], { status: 'PROPOSED', proposal, proposalSha256: proposalSha })
    function observe() {
      candidate.status = 'RUNTIME_OBSERVED'
      candidate.result.targetObservedRecovered = true
      candidate.result.repairSuccessful = false
      candidate.result.businessVerdictTrusted = false
      candidate.result.runtimeObservation = { fixtureOnly: true, homeItems: 20 }
      candidate.result.runtimeComparison = [{ field: 'homeItems', before: 0, after: 20 }]
      candidate.result.runtimeEvidence = { untrustedRuntimeSummary: { status: 'detail_returned' }, deniedCodes: [] }
      candidate.result.runtimeAcceptance = {
        policy: 'loader_required_nodes_v1', status: 'required_incomplete', successful: false,
        firstUnresolvedNode: 'S06', blockers: ['LOADER_REQUIRED_RESULTS_UNVERIFIED'],
        requiredCoverage: { total: 8, pass: 3, fail: 0, blocked: 1, notTested: 4 },
        nodes: ['S01', 'S02', 'S03', 'S06', 'C01', 'C05', 'R01', 'M01'].map(id => ({
          id, title: id, status: ['S01', 'S02', 'S03'].includes(id) ? 'pass' : id === 'S06' ? 'blocked' : 'not_tested',
          reason: id === 'S06' ? 'LOADER_RESULT_UNVERIFIED' : id.startsWith('S') ? 'CANDIDATE_STATIC_CHECK' : 'LOADER_NODE_NOT_VALIDATED'
        }))
      }
      repair.status = 'AWAITING_PROPOSAL'
      repair.stopCode = 'REQUIRED_RUNTIME_NODES_INCOMPLETE'
    }
    if (['stored', 'stale', 'revoked'].includes(mode)) { state.calls.push(makeCall('stored-key')); complete() }
    if (mode === 'release-observed') {
      observe()
      repair.usedRounds = 1
      state.candidates = [candidate]
    }
    if (mode === 'runtime-incomplete') {
      repair.status = 'AWAITING_RUNTIME_VALIDATION'
      repair.usedRounds = 1
      state.candidates = [candidate]
    }
    const json = (value, status = 200) => new Response(JSON.stringify(value),
      { status, headers: { 'Content-Type': 'application/json' } })
    const original = window.fetch
    window.fetch = async (input, options = {}) => {
      const path = new URL(String(input), location.href).pathname
      if (!path.startsWith('/api/plugin-maintenance/')) return original(input, options)
      const method = options.method || 'GET'
      const body = options.body ? JSON.parse(options.body) : undefined
      if (method !== 'GET') {
        state.writes.push({ path, method, body, csrf: options.headers?.['X-CSRF-TOKEN'] })
        if (options.headers?.['X-CSRF-TOKEN'] !== 'fixture-csrf') return json({ code: 'FIXTURE_CSRF_MISSING' }, 403)
      }
      if (path.endsWith('/csrf')) return json({ token: 'fixture-csrf', headerName: 'X-CSRF-TOKEN' })
      if (path.endsWith('/release-plans')) {
        if (method === 'POST') {
          if (body.expectedArtifactSha256 !== baseline || body.expectedCandidateSha256 !== candidateSha
              || body.candidateId !== candidate.id) return json({ code: 'RELEASE_INPUTS_CHANGED' }, 409)
          state.plans.push({ id: 'fixture-plan', candidateId: candidate.id, baselineArtifactSha256: baseline,
            candidateSha256: candidateSha, frozenSha256: '9'.repeat(64), status: 'AWAITING_RUNTIME_VALIDATION',
            createdAt: '2026-11-09T12:00:00Z', freshness: 'current', staleInputs: [], publishEligible: false,
            blockers: ['ISOLATED_RUNTIME_VALIDATION_REQUIRED', 'AT_RUNTIME_VALIDATION_REQUIRED',
              'MEDIA_VALIDATION_REQUIRED', 'AT_PUBLICATION_ADAPTER_UNAVAILABLE'] })
        }
        return json(method === 'POST' ? state.plans.at(-1) : state.plans)
      }
      if (path.endsWith('/release-plans/fixture-plan/frozen')) return json({
        authority: 'preparation_only', publishEligible: false, repair, candidate
      })
      if (path.endsWith('/model/connection')) return json(state.connection)
      if (path.endsWith('/model-consent')) {
        if (method === 'PUT') {
          if (body.expectedArtifactSha256 !== state.consent.artifactSha256)
            return json({ code: 'MODEL_CONSENT_CHANGED' }, 409)
          state.consent.artifactSha256 = body.artifactSha256
        }
        return json(state.consent)
      }
      if (path.includes('/artifacts/')) return new Response(source, { headers: { 'Content-Type': 'text/plain' } })
      if (path.endsWith('/model-calls') && method === 'POST') {
        let call = state.calls.find(call => call.requestKey === body.requestKey)
        if (!call) { call = makeCall(body.requestKey); state.calls.push(call); state.generations++ }
        if (mode === 'retry' && !state.lost) { state.lost = true; throw new TypeError('FIXTURE_RESPONSE_LOST') }
        return json(call, 202)
      }
      if (path.endsWith('/model-calls')) {
        state.callListReads++
        if (mode === 'refresh-error' && state.callListReads === 2)
          return json({ code: 'FIXTURE_REFRESH_FAILED' }, 503)
        return json(state.calls)
      }
      if (path.endsWith('/model-calls/fixture-call/cancel')) {
        state.calls[0].status = 'CANCELLED'
        return json(state.calls[0])
      }
      if (path.endsWith('/model-calls/fixture-call/submit')) {
        if (body.expectedProposalSha256 !== proposalSha) return json({ code: 'MODEL_PROPOSAL_CHANGED' }, 409)
        state.calls[0].candidateId = candidate.id
        state.calls[0].submissionStatus = 'SUBMITTED'
        state.candidates = [candidate]
        repair.status = 'AWAITING_RUNTIME_VALIDATION'
        repair.usedRounds = 1
        return json(candidate, 202)
      }
      if (path.endsWith('/repair-candidates/fixture-candidate/runtime-validation')) {
        observe()
        return json(candidate, 202)
      }
      if (path.endsWith('/sources/fixture-source/repairs')) return json([repair])
      if (path.endsWith('/repairs/fixture-repair')) return json(repair)
      if (path.endsWith('/repairs/fixture-repair/candidates')) return json(state.candidates)
      if (path.endsWith('/model-budget') || path.endsWith('/model/budget') || path.endsWith('/model/named-budget'))
        return json({ usedCalls: 0, dailyCallLimit: 3, reservedInputBytes: 0, reservedOutputTokens: 0 })
      return json({ code: 'FIXTURE_UNEXPECTED_API' }, 404)
    }
    window.__modelFixture = { state, complete, mode }
    createApp(mode === 'release-observed' ? ReleasePlanPanel : RepairPanel,
      { sourceId: 'fixture-source', artifactSha256: mode === 'stale' ? 'f'.repeat(64) : baseline,
      baselineRunId: 'fixture-run' }).use(ElementPlus).mount('#app')
  </script>
</body>
</html>
