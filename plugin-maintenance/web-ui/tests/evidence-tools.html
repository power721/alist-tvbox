<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>辅助证据本地测试</title>
  <style>
    body { margin: 0; color: #303133; background: white; font: 14px/1.5 sans-serif; }
    main { max-width: 960px; margin: auto; padding: 16px; min-width: 0; }
    .el-segmented { max-width: 100%; }
    .el-checkbox { white-space: normal; height: auto; }
    .el-checkbox__label { white-space: normal; }
  </style>
</head>
<body>
<main><p role="status">本地离线夹具，无爬虫、NAS、模型或发布调用。</p><div id="app"></div></main>
<script type="module">
  import { createApp } from 'vue'
  import ElementPlus from 'element-plus'
  import 'element-plus/dist/index.css'
  import EvidenceToolsPanel from '../src/EvidenceToolsPanel.vue'
  const state = { writes: [], changed: 0 }
  const json = (value, status = 200) => new Response(JSON.stringify(value),
    { status, headers: { 'Content-Type': 'application/json' } })
  const fetch = window.fetch
  window.fetch = async (input, options = {}) => {
    const url = new URL(String(input), location.href)
    if (!url.pathname.startsWith('/api/plugin-maintenance/')) return fetch(input, options)
    if (url.pathname.endsWith('/csrf')) return json({ token: 'fixture-only', headerName: 'X-CSRF-TOKEN' })
    if (options.headers?.['X-CSRF-TOKEN'] !== 'fixture-only') return json({ code: 'FIXTURE_CSRF' }, 403)
    state.writes.push({ path: url.pathname, query: url.search, body: JSON.parse(options.body) })
    if (url.pathname.endsWith('/browser-evidence')) return json({ code: 'BROWSER_EVIDENCE_DISABLED' }, 503)
    if (url.pathname.endsWith('/selector-proposals')) return json({
      id: 'fixture-candidate', roundNumber: 1, status: 'STATIC_VALIDATED',
      selectorEvidence: { passed: true, sourceExecutionObserved: false, publishEligible: false }
    }, 202)
    if (url.pathname.endsWith('/extraction/replay')) return json({
      authority: 'host_bounded_rule_extraction', passed: false, sourceExecutionObserved: false,
      sourceRuleBindingVerified: false, publishEligible: false,
      pages: [{ role: 'original', fieldCounts: [{ field: 'vod_name', matched: 0, transformed: 0, filtered: 1, kept: 0 }] }]
    })
    return json({ code: 'FIXTURE_UNEXPECTED_API' }, 404)
  }
  window.__evidenceFixture = state
  createApp(EvidenceToolsPanel, { sourceId: 'fixture-source', artifactSha256: 'a'.repeat(64),
    runId: '00000000-0000-4000-8000-000000000001', repairId: 'fixture-repair', canPropose: true,
    onChanged: () => state.changed++ }).use(ElementPlus).mount('#app')
</script>
</body>
</html>
