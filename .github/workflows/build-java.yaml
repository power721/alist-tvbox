name: 'release java'

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'pom.xml'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare release
        uses: power721/atv-build-tools/prepare-release@v1
        with:
          token: ${{ secrets.RELEASE_MODULE_TOKEN }}

      - name: Set telemetry endpoint
        env:
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          if [ -n "$TELEMETRY_URL" ]; then
            mkdir -p src/main/resources
            printf 'app.telemetry.url=%s\n' "$TELEMETRY_URL" > src/main/resources/telemetry.properties
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Verify release artifact
        uses: power721/atv-build-tools/verify-release@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build docker and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile-jre
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/java:21
          cache-from: type=gha
          cache-to: type=gha,mode=max