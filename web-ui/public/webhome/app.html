<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影视首页</title>
<style>
  /* 兼容红线:不用 flex gap / clamp() / aspect-ratio / :is() / :has();高度用 --fm-web-height 兜底 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; }
  body {
    min-height: 100vh;
    min-height: var(--fm-web-height, 100vh);
    background: #0b0e14;
    color: #e8ecf3;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(1200px 500px at 75% -10%, #1d2b50 0%, rgba(13,17,27,0) 65%),
                radial-gradient(900px 420px at 10% 110%, #16233f 0%, rgba(13,17,27,0) 60%);
    z-index: 0;
  }
  .page { position: relative; z-index: 1; padding-bottom: 48px; }

  .topbar {
    display: flex; align-items: center;
    padding: calc(var(--safe-top, 0px) + 18px) 42px 14px 42px;
  }
  .brand { font-size: 26px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  .brand .dot { color: #4f8cff; }
  .searchrow {
    display: flex; padding: 0 42px 4px 42px;
  }
  .searchbox { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; }
  .searchbox input {
    flex: 1 1 auto; min-width: 120px; max-width: 480px; height: 40px; padding: 0 14px;
    border: 1px solid #2a3354; border-radius: 20px;
    background: rgba(255,255,255,0.06); color: #e8ecf3; font-size: 15px; outline: none;
  }
  .searchbox input:focus { border-color: #4f8cff; background: rgba(79,140,255,0.10); }
  .searchbox .btn {
    flex: 0 0 auto; margin-left: 10px; height: 40px; padding: 0 10px;
    border: none; border-radius: 20px; background: #2c4a8f; color: #fff;
    font-size: 15px; cursor: pointer; outline: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }
  .searchbox .btn:hover, .searchbox .btn:focus, .searchbox .btn.focus {
    background: #4f8cff; outline: none;
  }
  .icon-btn {
    flex: 0 0 auto; margin-left: 12px; height: 40px; min-width: 40px; padding: 0 8px;
    border: 1px solid #2a3354; border-radius: 20px; background: rgba(255,255,255,0.06);
    color: #9fb0cc; font-size: 14px; cursor: pointer; outline: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }
  .icon-btn:focus { outline: none; border-color: #4f8cff; color: #fff; }
  .icon-btn:hover, .icon-btn.focus { border-color: #4f8cff; color: #fff; }

  .row { margin-top: 26px; }
  .row-title {
    display: flex; align-items: baseline;
    padding: 0 42px; margin-bottom: 14px;
  }
  .row-title h2 { font-size: 19px; font-weight: 600; }
  .row-title .more { margin-left: auto; font-size: 13px; color: #7d8ba6; cursor: pointer; }
  .row-title .more:hover, .row-title .more.focus { color: #4f8cff; }

  .rail { display: flex; overflow-x: auto; overflow-y: hidden; padding: 6px 42px 18px 42px; }
  .rail::-webkit-scrollbar { height: 0; }

  .card {
    position: relative; flex: 0 0 auto; width: 150px; margin-right: 18px;
    cursor: pointer; border-radius: 10px; outline: none;
  }
  .poster {
    position: relative; width: 100%; padding-top: 133%; /* 2:3 海报,替代 aspect-ratio */
    border-radius: 10px; overflow: hidden; background: #17203a;
    border: 2px solid rgba(255,255,255,0.08);
  }
  .poster img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .poster .ph {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    color: #55648a; font-size: 13px; text-align: center; padding: 8px;
  }
  .badge {
    position: absolute; left: 6px; top: 6px; z-index: 2;
    max-width: 138px; padding: 2px 8px; border-radius: 4px;
    background: rgba(10,14,24,0.78); color: #ffd35c; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge-rating {
    position: absolute; right: 6px; bottom: 34px; z-index: 2;
    padding: 2px 8px; border-radius: 4px;
    background: rgba(10,14,24,0.78); color: #7fd48f; font-size: 12px;
    white-space: nowrap;
  }
  /* 海报底部渐变信息条:标题+副行(参考 tmdb.html vod-info) */
  .poster .info {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 26px 8px 7px 8px;
    background: linear-gradient(180deg, rgba(8,11,18,0) 0%, rgba(8,11,18,0.88) 60%);
  }
  .poster .info .t {
    font-size: 13px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .poster .info .s {
    margin-top: 2px; font-size: 11px; color: rgba(255,255,255,0.72);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 焦点视觉:描边+光晕+微缩放(参考 tmdb.html focus scale) */
  .card { transition: transform 0.15s; }
  .card:hover .poster, .card.focus .poster {
    border-color: #4f8cff; box-shadow: 0 0 0 3px rgba(79,140,255,0.55), 0 8px 22px rgba(0,0,0,0.55);
  }
  .card:hover, .card.focus { transform: scale(1.03); z-index: 5; }

  .detail-page {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50;
    min-height: var(--fm-web-height, 100vh);
    overflow-y: auto; background: #0b0e14;
  }
  .detail-bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
    background-position: center 30%; background-size: cover;
    filter: blur(26px) saturate(1.15); opacity: 0.45;
    transform: scale(1.2);
  }
  .detail-bg::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(11,14,20,0.55) 0%, rgba(11,14,20,0.92) 70%);
  }
  .detail-panel { position: relative; z-index: 1; }
  .detail-page.show { display: block; }
  .detail-panel {
    display: flex; width: 100%; max-width: 1180px;
    margin: 0 auto; padding: calc(var(--safe-top, 0px) + 56px) 56px 48px 56px;
  }
  .detail-poster {
    flex: 0 0 240px; height: 360px; border-radius: 10px; overflow: hidden;
    background: #17203a; border: 1px solid rgba(255,255,255,0.08);
  }
  .detail-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-info { flex: 1 1 auto; min-width: 0; margin-left: 28px; overflow-y: auto; }
  .detail-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .detail-meta { font-size: 14px; color: #9fb0cc; margin-bottom: 10px; }
  .detail-chips { margin-bottom: 14px; }
  .detail-chips .chip {
    display: inline-block; margin: 0 8px 6px 0; padding: 3px 10px;
    border-radius: 12px; font-size: 12px;
    background: rgba(79,140,255,0.14); color: #8fb7ff;
  }
  .detail-chips .chip.rating { background: rgba(255,211,92,0.15); color: #ffd35c; }
  .detail-people { font-size: 13px; line-height: 1.8; color: #9fb0cc; margin-bottom: 14px; }
  .detail-people b { color: #c6d1e4; font-weight: 600; }
  .detail-desc {
    font-size: 14px; line-height: 1.7; color: #c6d1e4; margin-bottom: 20px;
    max-height: 200px; overflow-y: auto;
  }
  .detail-actions { display: flex; }
  /* 三个动作按钮统一样式(等高同底),仅焦点态高亮 —— 避免主次底色差异造成的"大小不一"观感 */
  .detail-actions .act {
    flex: 0 0 auto; margin-right: 14px; height: 44px; line-height: 44px; padding: 0 22px;
    border: 1px solid #2a3354; border-radius: 22px; background: rgba(255,255,255,0.08);
    color: #e8ecf3; font-size: 15px; cursor: pointer; outline: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }
  .detail-actions .act:hover, .detail-actions .act:focus, .detail-actions .act.focus {
    background: #4f8cff; border-color: #4f8cff; color: #fff; outline: none;
  }

  .state { padding: 18px 42px; color: #7d8ba6; font-size: 14px; }

  /* Hero 轮播横幅(参考 tmdb.html hero-card):双层背景交叉淡入 + 渐变遮罩 + 圆点指示 */
  .hero {
    position: relative; margin: 16px 42px 0 42px; height: 300px;
    border-radius: 14px; overflow: hidden; background: #121a2c;
  }
  .hero-bg {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-position: center 30%; background-size: cover;
    opacity: 0; transition: opacity 0.8s;
  }
  .hero-bg.show { opacity: 1; }
  .hero-shade {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(7,10,17,0.82) 0%, rgba(7,10,17,0.35) 45%, rgba(7,10,17,0.05) 70%),
                linear-gradient(0deg, rgba(7,10,17,0.9) 0%, rgba(7,10,17,0) 40%);
  }
  .hero-info {
    position: absolute; left: 30px; bottom: 24px; z-index: 2; max-width: 44%;
  }
  .hero-title {
    font-size: 28px; font-weight: 800; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .hero-remark {
    margin-top: 6px; font-size: 14px; color: rgba(255,255,255,0.75);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hero-btn {
    margin-top: 14px; height: 42px; padding: 0 24px;
    border: none; border-radius: 21px; background: #4f8cff; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; outline: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }
  .hero-btn:hover, .hero-btn:focus, .hero-btn.focus {
    background: #6ba1ff; box-shadow: 0 0 0 3px rgba(79,140,255,0.4);
    outline: none;
  }
  .hero-dots {
    position: absolute; right: 22px; bottom: 22px; z-index: 2; display: flex;
  }
  .hero-dots .dot {
    width: 8px; height: 8px; margin-left: 8px; border-radius: 4px;
    background: rgba(255,255,255,0.35);
  }
  .hero-dots .dot.on { background: #4f8cff; }

  /* 竖屏手机适配:收窄留白,详情页改纵向布局 */
  @media (max-width: 720px) {
    .topbar { padding: calc(var(--safe-top, 0px) + 14px) 18px 10px 18px; }
    .brand { font-size: 21px; }
    .searchrow { padding: 0 18px 4px 18px; }
    .row-title { padding: 0 18px; }
    .rail { padding: 6px 18px 18px 18px; }
    .state { padding: 14px 18px; }
    .hero { margin: 12px 18px 0 18px; height: 210px; }
    .hero-title { font-size: 22px; }
    .hero-info { max-width: 74%; }
    .card { width: 120px; margin-right: 12px; }
    .badge { max-width: 108px; }
    .detail-panel {
      display: block; padding: calc(var(--safe-top, 0px) + 24px) 20px 40px 20px;
    }
    .detail-poster { width: 180px; height: 270px; margin: 0 auto; }
    .detail-info { margin: 18px 0 0 0; }
    .detail-title { font-size: 20px; }
    .detail-actions { flex-wrap: wrap; }
    .detail-actions .act { margin: 0 10px 10px 0; height: 40px; padding: 0 16px; }
  }
  .state a, .state .link { color: #4f8cff; cursor: pointer; }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(20,26,40,0.95); color: #e8ecf3; font-size: 14px;
    padding: 10px 22px; border-radius: 8px; border: 1px solid #2a3354;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="topbar">
    <div class="brand">影视<span class="dot">首页</span></div>
  </div>
  <div class="searchrow">
    <div class="searchbox">
      <input id="kw" type="text" placeholder="搜索影视 / 订阅…" autocomplete="off">
      <button class="btn" id="search-btn" type="button">搜索</button>
      <button class="icon-btn" id="refresh-btn" type="button" title="刷新">↻ 刷新</button>
    </div>
  </div>
  <div class="hero" id="hero" style="display:none">
    <div class="hero-bg" id="hero-bg-a"></div>
    <div class="hero-bg" id="hero-bg-b"></div>
    <div class="hero-shade"></div>
    <div class="hero-info">
      <div class="hero-title" id="hero-title"></div>
      <div class="hero-remark" id="hero-remark"></div>
      <button class="hero-btn" id="hero-btn" type="button">立即观看</button>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </div>
  <div id="rows"></div>
</div>
<div class="toast" id="toast"></div>
<div class="detail-page" id="detail-page">
  <div class="detail-bg" id="detail-bg"></div>
  <div class="detail-panel">
    <div class="detail-poster"><img id="detail-pic" alt=""></div>
    <div class="detail-info">
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-chips" id="detail-chips"></div>
      <div class="detail-people" id="detail-people"></div>
      <div class="detail-desc" id="detail-desc"></div>
      <div class="detail-actions">
        <button class="act" id="detail-search" type="button">搜索播放</button>
        <button class="act" id="detail-sub" type="button">➕ 加入追剧</button>
        <button class="act" id="detail-close" type="button">关闭</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== ES5 兼容引导层(必须在任何 ES2017 代码之前,任何内核都能执行) ===== */
(function () {
  'use strict';
  if (window.NodeList && !NodeList.prototype.forEach) {
    NodeList.prototype.forEach = Array.prototype.forEach;
  }
  if (window.HTMLCollection && !HTMLCollection.prototype.forEach) {
    HTMLCollection.prototype.forEach = Array.prototype.forEach;
  }
  if (!Array.prototype.includes) {
    Array.prototype.includes = function (v) {
      for (var i = 0; i < this.length; i++) { if (this[i] === v) return true; }
      return false;
    };
  }
  if (typeof Promise !== 'undefined' && !Promise.prototype.finally) {
    Promise.prototype.finally = function (cb) {
      var C = this.constructor;
      return this.then(function (v) { return C.resolve(cb()).then(function () { return v; }); },
        function (e) { return C.resolve(cb()).then(function () { throw e; }); });
    };
  }
  if (window.fongmiBridge) { document.documentElement.className += ' fm-native'; }
})();
</script>

<script>
/* ===== 业务代码:ES2017 基线,严禁 ?. ?? 逻辑赋值 ===== */
(function () {
  'use strict';

  /* ---------- 基础工具 ---------- */
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }
  function qs(id) { return document.getElementById(id); }
  var toastTimer = null;
  function toast(msg) {
    var node = qs('toast');
    node.textContent = msg;
    node.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.classList.remove('show'); }, 2200);
  }

  /* ---------- 环境与 SDK ---------- */
  var native = !!window.fongmiBridge || (window.fongmiClient != null);
  var fm = null;      // fmsdk 事件后可用
  /* SERVER:WebHome 原生场景=页面所在 origin;JJ-html 等本地加载器场景页面在 127.0.0.1:2026,
   * 由 /webhome/jj.html 下载端点在文件头注入 window.ATV_SERVER/ATV_TOKEN(或 ?server= 参数) */
  var SERVER = location.origin;
  try {
    var sm = location.search.match(/[?&]server=([^&]*)/);
    if (sm) SERVER = decodeURIComponent(sm[1].replace(/\/+$/, ''));
  } catch (e) { }
  if (window.ATV_SERVER) SERVER = String(window.ATV_SERVER).replace(/\/+$/, '');
  var token = '';
  try {
    var m = location.search.match(/[?&]token=([^&]*)/);
    if (m) token = decodeURIComponent(m[1].replace(/\+/g, '%20'));
  } catch (e) { token = ''; }
  if (!token && window.ATV_TOKEN) token = String(window.ATV_TOKEN);
  /* 播放同步专用令牌(URL ?pt=):继续观看的服务端数据源,不依赖宿主桥 */
  var ptok = '';
  try {
    var ptm = location.search.match(/[?&]pt=([^&]*)/);
    if (ptm) ptok = decodeURIComponent(ptm[1].replace(/\+/g, '%20'));
  } catch (e) { ptok = ''; }
  var API_BASE = SERVER + '/media' + (token && token !== '-' ? '/' + encodeURIComponent(token) : '');

  function getJson(url) {
    if (fm && fm.req) {
      /* fm.req 返回信封对象 {ok,status,body...},responseType:json 时 body 已是解析结果 */
      return fm.req(url, { method: 'GET', responseType: 'json' }).then(function (res) {
        if (!res || res.ok === false) {
          throw new Error((res && res.error) || ('HTTP ' + (res && res.status)));
        }
        var body = res.body;
        if (typeof body === 'string') {
          try { return JSON.parse(body); } catch (e) { return null; }
        }
        return body;
      });
    }
    /* 浏览器预览 fallback(WebHome 内不会走到,统一 fm.req 走 Native OkHttp) */
    return fetch(url).then(function (r) { return r.json(); });
  }

  /* ---------- 行/卡片渲染 ---------- */
  var rowsBox = qs('rows');
  var rowRegistry = [];   /* { element, cards: [cardEl...] } 供遥控器导航 */

  function buildRow(title, moreLabel, moreAction) {
    var row = el('div', 'row');
    var rail = el('div', 'rail');
    var state = el('div', 'state', '加载中…');
    var entry = { element: rail, state: state, cards: [], rowEl: row };
    var head = el('div', 'row-title');
    head.appendChild(el('h2', null, title));
    if (moreLabel && moreAction) {
      var more = el('span', 'more', moreLabel);
      more.onclick = moreAction;
      head.appendChild(more);
      attachMore(entry, registerFocusable(more, entry, -1));
    }
    row.appendChild(head);
    row.appendChild(rail);
    row.appendChild(state);
    rowsBox.appendChild(row);
    rowRegistry.push(entry);
    return entry;
  }

  function setState(entry, text, retry) {
    clear(entry.state);
    if (text == null) { entry.state.style.display = 'none'; return; }
    entry.state.style.display = '';
    entry.state.appendChild(document.createTextNode(text + ' '));
    if (retry) {
      var link = el('span', 'link', '重试');
      link.onclick = retry;
      registerFocusable(link, entry, -1);
      entry.state.appendChild(link);
    }
  }

  function renderCards(entry, items, action) {
    clear(entry.state);
    entry.state.style.display = 'none';
    entry.cards = [];
    var rail = entry.element;
    clear(rail);
    if (!items || !items.length) {
      setState(entry, '暂无内容', null);
      return;
    }
    for (var i = 0; i < items.length; i++) {
      entry.cards.push(buildCard(rail, items[i], action, entry));
    }
  }

  /** 封面地址:本服务相对路径(/images 代理)补全 SERVER 绝对地址(JJ-html 场景页面不在服务端域);
   *  外站绝对地址走 fm.res 本地网关(异常回落原始地址)。 */
  function coverSrc(pic) {
    if (!pic) return pic;
    if (pic.indexOf('/') === 0) return SERVER + pic;
    if (pic.indexOf('http') === 0 && fm && fm.res) {
      try { return fm.res(pic); } catch (e) { return pic; }
    }
    return pic;
  }

  function buildCard(rail, item, action, entry) {
    var card = el('div', 'card');
    var poster = el('div', 'poster');
    var pic = item.vodPic || item.vod_pic || item.pic || '';
    var name = item.vodName || item.vod_name || item.title || '';
    var remark = item.vodRemarks || item.vod_remarks || '';
    /* 评分段(「· 豆瓣 7.6」/ TMDB 条目裸数字「6.8」)拆出,单独显示在海报左下角 */
    var rating = '';
    var segs = remark.split('·');
    var rest = [];
    for (var si = 0; si < segs.length; si++) {
      var seg = segs[si].trim();
      var isRating = (/(豆瓣|TMDB|IMDb| imdb)/i.test(seg) && /\d(\.\d)?/.test(seg))
        || /^\d+(\.\d+)?$/.test(seg);
      if (!rating && seg && isRating) {
        rating = /^\d+(\.\d+)?$/.test(seg) ? ('TMDB ' + seg) : seg;
      } else if (seg) {
        rest.push(seg);
      }
    }
    remark = rest.join(' · ');
    if (remark) poster.appendChild(el('div', 'badge', remark));
    if (rating) poster.appendChild(el('div', 'badge-rating', rating));
    if (pic) {
      var img = el('img');
      img.alt = name;
      img.onload = function () { ph.style.display = 'none'; };
      img.onerror = function () { img.style.display = 'none'; };
      /* 同源相对地址(本服务 /images 代理)直连;外站绝对地址按文档走 fm.res 本地网关,
       * fm.res 对非 http 形态可能抛错,兜底回落原始地址 */
      img.src = coverSrc(pic);
      img.loading = 'lazy'; /* 原生懒加载,长列表省流量 */
      poster.appendChild(img);
    }
    var ph = el('div', 'ph', name || '—');
    poster.appendChild(ph);
    /* 海报底部渐变信息条:标题 + 副行(备注/年份);顶部角标保留进度 */
    var info = el('div', 'info');
    info.appendChild(el('div', 't', name || '—'));
    if (remark) info.appendChild(el('div', 's', remark));
    poster.appendChild(info);
    card.appendChild(poster);
    var run = function () {
      if (action) action(item, card);
    };
    card.onclick = run;
    /* 长按搜索已按需求下线:原实现的「长按后合成 click 压制」在 keyup 被跳走的搜索页吃掉后
     * 会粘住,吞掉下一次真实点击(= 有时要点两次才能进详情);搜索入口收敛到详情页搜索按钮
     * 与顶部搜索框。Enter 键下沉到卡片即止(防 document 处理器再触发 current.node.click()
     * 造成双重激活),激活由 keyup 合成 click 完成 —— 与原短按路径完全一致 */
    card.onkeydown = function (ev) {
      if (ev.key === 'Enter' || ev.keyCode === 23 || ev.keyCode === 13) ev.stopPropagation();
    };
    card.onkeyup = function (ev) {
      if (ev.key === 'Enter' || ev.keyCode === 23 || ev.keyCode === 13) ev.stopPropagation();
    };
    registerFocusable(card, entry, entry ? entry.cards.length : 0);
    rail.appendChild(card);
    return card;
  }

  /* ---------- 遥控器/键盘焦点导航(行×列空间移动) ---------- */
  var focusables = [];  /* { node, entry, index } 与 rowRegistry 同序 */
  /* 指针交互(触屏/鼠标)期间来的焦点不滚动:点击→焦点→滚动居中会把卡片移出手指/光标下方,
   * 浏览器按「内容发生移动」取消本次合成 click(= 要点两次才能进详情;卡片已居中/无法
   * 再移动时才一次生效)。键盘/遥控器导航没有指针事件,照常滚动对齐。 */
  var lastPointerAt = 0;
  document.addEventListener('touchstart', function () { lastPointerAt = Date.now(); }, true);
  document.addEventListener('mousedown', function () { lastPointerAt = Date.now(); }, true);
  function registerFocusable(node, entry, index) {
    var record = { node: node, entry: entry, index: index };
    focusables.push(record);
    node.setAttribute('tabindex', '-1');
    node.addEventListener('focus', function () {
      current = record;
      node.classList.add('focus');
      if (Date.now() - lastPointerAt > 400) scrollIntoViewCompat(node);
    });
    node.addEventListener('blur', function () { node.classList.remove('focus'); });
    return record;
  }
  var current = null;
  function scrollIntoViewCompat(node) {
    var top = node.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0);
    var h = window.innerHeight || document.documentElement.clientHeight;
    if (top < 90 || top > h - 160) {
      window.scrollTo(0, Math.max(0, top - h / 3));
    }
    if (node.scrollIntoView) {
      try { node.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
      catch (e) { node.scrollIntoView(false); }
    }
  }
  function focusRecord(record) {
    if (record && record.node) {
      try { record.node.focus(); } catch (e) { }
      current = record;
      record.node.classList.add('focus');
      scrollIntoViewCompat(record.node);
    }
  }
  function entryCards(entry) { return entry ? entry.cards : []; }

  function moveHorizontal(delta) {
    if (!current) { focusFirst(); return; }
    if (current.entry == null) {
      var ti = toolbarRecords.indexOf(current);
      if (ti >= 0 && toolbarRecords.length) {
        focusRecord(toolbarRecords[(ti + delta + toolbarRecords.length) % toolbarRecords.length]);
      }
      return;
    }
    var cards = entryCards(current.entry);
    var idx = cards.indexOf(current.node);
    if (idx < 0) idx = 0;
    var next = idx + delta;
    if (next >= 0 && next < cards.length) {
      focusRecord(findRecord(cards[next], current.entry));
    } else if (delta > 0 && current.entry.more) {
      focusRecord(current.entry.more);
    } else if (delta < 0 && current.entry.more) {
      focusRecord(current.entry.more);
    }
  }
  function moveVertical(delta) {
    if (!current) { focusFirst(); return; }
    if (current.entry == null) {
      /* 顶栏工具组:向下回网格首行,向上到顶无事 */
      if (delta > 0) focusFirst();
      return;
    }
    var pos = rowPosition(current);
    var nextPos = pos.row + delta;
    if (nextPos < 0) { focusToolbar(); return; }
    while (nextPos >= 0 && nextPos < rowRegistry.length) {
      var entry = rowRegistry[nextPos];
      var cards = entryCards(entry);
      if (cards.length) {
        var idx = Math.min(pos.col, cards.length - 1);
        focusRecord(findRecord(cards[idx], entry));
        return;
      }
      nextPos += delta > 0 ? 1 : -1;
    }
    /* 无邻行卡片时,允许落在「更多/重试」链接 */
    if (nextPos >= 0 && nextPos < rowRegistry.length && rowRegistry[nextPos].more) {
      focusRecord(rowRegistry[nextPos].more);
    }
  }
  function rowPosition(record) {
    var row = -1;
    for (var i = 0; i < rowRegistry.length; i++) {
      if (rowRegistry[i] === record.entry) { row = i; break; }
    }
    var col = 0;
    var cards = entryCards(record.entry);
    var idx = cards.indexOf(record.node);
    if (idx >= 0) col = idx;
    else if (record.entry && record.entry.more && record.entry.more.node === record.node) col = 999;
    return { row: row, col: col };
  }
  function findRecord(node, entry) {
    for (var i = 0; i < focusables.length; i++) {
      if (focusables[i].node === node && focusables[i].entry === entry) return focusables[i];
    }
    return { node: node, entry: entry, index: 0 };
  }
  function focusFirst() {
    for (var i = 0; i < rowRegistry.length; i++) {
      if (rowRegistry[i].cards.length) { focusRecord(findRecord(rowRegistry[i].cards[0], rowRegistry[i])); return; }
    }
    if (focusables.length) focusRecord(focusables[0]);
  }
  /* buildRow 里 more 链接登记后回填 entry.more,供水平导航 */
  function attachMore(entry, record) { entry.more = record; }

  /* ---------- 顶栏工具组(搜索框→搜索→刷新):网格之上的虚拟行 ----------
   * 首行再向上聚焦于此;输入框内方向左右仍归光标编辑(见 kw 键处理),仅下键回网格 */
  var toolbarRecords = [registerFocusable(qs('kw'), null, 0),
    registerFocusable(qs('search-btn'), null, 1),
    registerFocusable(qs('refresh-btn'), null, 2)];
  function focusToolbar() {
    if (toolbarRecords.length) focusRecord(toolbarRecords[0]);
  }

  document.addEventListener('keydown', function (ev) {
    var key = ev.key;
    var code = ev.keyCode;
    if (heroItems.length) restartHeroAuto();
    /* 详情浮层打开时:左右切按钮,返回/ESC 关闭,Enter 触发,屏蔽网格导航 */
    if (qs('detail-page').classList.contains('show')) {
      if (key === 'Escape' || code === 27 || code === 4) { closeDetail(); ev.preventDefault(); return; }
      var obtns = overlayButtons();
      var oidx = 0;
      for (var oi = 0; oi < obtns.length; oi++) { if (obtns[oi] === document.activeElement) { oidx = oi; break; } }
      if (key === 'ArrowLeft' || code === 21) { focusOverlayBtn(Math.max(0, oidx - 1)); ev.preventDefault(); }
      else if (key === 'ArrowRight' || code === 22) { focusOverlayBtn(Math.min(obtns.length - 1, oidx + 1)); ev.preventDefault(); }
      else if (key === 'Enter' || code === 23 || code === 13) {
        if (document.activeElement && document.activeElement.click) document.activeElement.click();
        ev.preventDefault();
      }
      return;
    }
    if (key === 'ArrowLeft' || code === 21) { moveHorizontal(-1); ev.preventDefault(); }
    else if (key === 'ArrowRight' || code === 22) { moveHorizontal(1); ev.preventDefault(); }
    else if (key === 'ArrowUp' || code === 19) { moveVertical(-1); ev.preventDefault(); }
    else if (key === 'ArrowDown' || code === 20) { moveVertical(1); ev.preventDefault(); }
    else if (key === 'Enter' || code === 23 || code === 13) {
      if (current && current.node) {
        current.node.click();
        ev.preventDefault();
      }
    }
    /* 遥控器菜单键(82)/搜索快捷:聚焦搜索框 */
    else if (code === 82 || key === 'Search') {
      qs('kw').focus();
      ev.preventDefault();
    }
  });

  /* ---------- 播放动作 ---------- */
  function openVod(siteKey, vodId, name, pic) {
    if (fm && fm.vod) {
      fm.vod(siteKey, vodId, name || '', pic || '').catch(function () { toast('打开失败'); });
    } else {
      toast('当前客户端不支持 WebHome');
    }
  }
  function openMediaItem(item) {
    openVod('csp_Media', item.vod_id || item.id, item.vod_name || item.name, item.vod_pic || item.pic);
  }
  function openHistory(item) {
    /* JJ-html 的 fm.history 直接带 siteKey/vodId 字段;WebHome 原生 key 为三段
     * siteKey@@@vodId@@@cid(VideoActivity.getHistoryKey),取前两段 */
    var siteKey = item.siteKey || '';
    var vodId = item.vodId || '';
    if (!siteKey || !vodId) {
      var parts = String(item.key || '').split('@@@');
      siteKey = parts.length >= 2 ? parts[0] : '';
      vodId = parts.length >= 2 ? parts[1] : '';
    }
    if (siteKey && vodId) {
      openVod(siteKey, vodId, item.vodName, item.vodPic);
    } else {
      /* 兜底:按键名搜索 */
      doSearch(item.vodName || '');
    }
  }

  /* ---------- 榜单条目网页详情浮层(不进原生播放,参考 nostr 自绘详情) ---------- */
  var overlayState = null;

  function playBase() {
    return SERVER + '/play' + (token && token !== '-' ? '/' + token : '');
  }

  function overlayButtons() {
    return [qs('detail-search'), qs('detail-sub'), qs('detail-close')];
  }

  function focusOverlayBtn(idx) {
    var btns = overlayButtons();
    if (btns[idx]) { try { btns[idx].focus(); } catch (e) { } }
  }

  function openBoardDetail(item) {
    overlayState = null;
    qs('detail-title').textContent = item.vod_name || item.name || '';
    qs('detail-meta').textContent = '';
    qs('detail-desc').textContent = '加载中…';
    var img = qs('detail-pic');
    img.style.display = 'none';
    var pic = item.vod_pic || item.pic || '';
    if (pic) {
      img.src = coverSrc(pic);
      img.style.display = '';
    }
    qs('detail-sub').textContent = '➕ 加入追剧';
    showDetailPage();
    focusOverlayBtn(0);
    getJson(API_BASE + '?id=' + encodeURIComponent(item.vod_id)).then(function (data) {
      var d = data && data.list && data.list.length ? data.list[0] : null;
      if (!d) { qs('detail-desc').textContent = '详情加载失败(响应无条目)。'; return; }
      overlayState = { detail: d };
      try {
        renderBoardDetail(d);
      } catch (e) {
        qs('detail-desc').textContent = '详情渲染异常: ' + (e && e.message ? e.message : e);
      }
    }).catch(function (err) {
      qs('detail-desc').textContent = '详情加载失败: ' + (err && err.message ? err.message : err);
    });
  }

  function renderBoardDetail(d) {
    var meta = [];
    if (d.vod_year) meta.push(d.vod_year);
    if (d.vod_area) meta.push(d.vod_area);
    if (d.vod_lang) meta.push(d.vod_lang);
    var remarks = String(d.vod_remarks || '');
    var subscribed = remarks.indexOf('已追') === 0;
    var rating = '';
    var restSegs = [];
    var segs = remarks.split('·');
    for (var i = 0; i < segs.length; i++) {
      var seg = segs[i].trim();
      /* 评分段两种形态:「豆瓣 7.6」带源名 / TMDB 条目的裸数字「6.8」 */
      var isRating = (/(豆瓣|TMDB|IMDb| imdb)/i.test(seg) && /\d(\.\d)?/.test(seg))
        || /^\d+(\.\d+)?$/.test(seg);
      if (seg && !rating && isRating) rating = seg;
      else if (seg && seg.indexOf('已追') !== 0) restSegs.push(seg);
    }
    if (restSegs.length) meta.push(restSegs.join(' · '));
    overlayState.subscribed = subscribed;
    qs('detail-title').textContent = d.vod_name || '';
    qs('detail-meta').textContent = meta.join(' · ');

    /* 类型 chips + 评分高亮 chip */
    var chips = qs('detail-chips');
    clear(chips);
    if (d.type_name) {
      var genres = String(d.type_name).split('/');
      for (var g = 0; g < genres.length; g++) {
        var gt = genres[g].trim();
        if (gt) chips.appendChild(el('span', 'chip', gt));
      }
    }
    if (rating) chips.appendChild(el('span', 'chip rating', '★ ' + rating));

    /* 导演/演员 */
    var people = qs('detail-people');
    clear(people);
    function addPeople(label, value) {
      var row = el('div');
      row.appendChild(el('b', null, label + ':'));
      row.appendChild(document.createTextNode(' ' + value));
      people.appendChild(row);
    }
    if (d.vod_director) addPeople('导演', d.vod_director);
    if (d.vod_actor) addPeople('演员', String(d.vod_actor).split(/[\/,、]/).join(' · '));

    qs('detail-desc').textContent = d.vod_content || '暂无简介';
    if (d.vod_pic) {
      var img = qs('detail-pic');
      img.src = coverSrc(d.vod_pic);
      img.style.display = '';
      qs('detail-bg').style.backgroundImage = 'url(' + coverSrc(d.vod_pic) + ')';
    }
    qs('detail-sub').textContent = subscribed ? '➖ 取消追剧' : '➕ 加入追剧';
  }

  /* 整页详情 + WebView history 集成:pushState 进详情,返回键/浏览器回退回列表 */
  var detailPushed = false;

  function showDetailPage() {
    qs('detail-page').classList.add('show');
    /* JJ-html 加载器的返回键检查 detail-active 等 class,命中才派发 Escape 而非直接关弹窗 */
    document.body.className += ' detail-active';
    try {
      history.pushState({ fmDetail: 1 }, '', '#detail');
      detailPushed = true;
    } catch (e) { detailPushed = false; }
  }

  function hideDetailPage() {
    qs('detail-page').classList.remove('show');
    document.body.className = document.body.className.replace(/\s*detail-active\b/, '');
  }

  window.addEventListener('popstate', function () {
    if (qs('detail-page').classList.contains('show')) {
      hideDetailPage();
      detailPushed = false;
      overlayState = null;
      if (current) scrollIntoViewCompat(current.node);
    }
  });

  function closeDetail() {
    hideDetailPage();
    overlayState = null;
    if (detailPushed) {
      detailPushed = false;
      try { history.back(); } catch (e) { }
    }
    if (current) scrollIntoViewCompat(current.node);
  }

  function toggleSubscribe() {
    if (!overlayState || !overlayState.detail) return;
    var d = overlayState.detail;
    var prefix = overlayState.subscribed ? 'msubdel-' : 'msubadd-';
    /* 载荷 {vodId}|{剧名} 与 spider 通道同口径;GET /play/{token} 返回 {msg} 回执 */
    var url = playBase() + '?id=' + encodeURIComponent(prefix + d.vod_id + '|' + d.vod_name) + '&type=jar';
    qs('detail-sub').textContent = '提交中…';
    getJson(url).then(function (res) {
      toast(res && res.msg ? res.msg : '操作已提交');
      return getJson(API_BASE + '?id=' + encodeURIComponent(d.vod_id));
    }).then(function (data) {
      var nd = data && data.list && data.list.length ? data.list[0] : null;
      if (nd) renderBoardDetail(nd);
    }).catch(function () {
      toast('操作失败,请重试');
      qs('detail-sub').textContent = overlayState && overlayState.subscribed ? '➖ 取消追剧' : '➕ 加入追剧';
    });
  }

  qs('detail-close').onclick = closeDetail;
  /* 点击浮层背景(非面板区域)关闭 */
  qs('detail-search').onclick = function () {
    var name = overlayState && overlayState.detail ? overlayState.detail.vod_name : qs('detail-title').textContent;
    if (name) doSearch(name);
  };
  qs('detail-sub').onclick = toggleSubscribe;

  /* ---------- 搜索 ---------- */
  function doSearch(keyword) {
    keyword = (keyword || '').trim();
    if (!keyword) { qs('kw').focus(); return; }
    if (fm && fm.search) {
      fm.search(keyword, { direct: true }).catch(function () { toast('搜索失败'); });
    } else {
      toast('当前客户端不支持 WebHome');
    }
  }
  qs('search-btn').onclick = function () { doSearch(qs('kw').value); };
  qs('kw').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.keyCode === 13) { doSearch(qs('kw').value); }
    /* 方向下放行冒泡:输入框内按下键回网格(其余键不冒泡,保持光标编辑) */
    if (ev.key === 'ArrowDown' || ev.keyCode === 20) return;
    ev.stopPropagation(); /* 输入框内不触发全局方向导航 */
  });
  qs('refresh-btn').onclick = function () {
    if (fm && fm.reload) { fm.reload(); } else { location.reload(); }
  };

  /* ---------- 数据加载 ---------- */
  function loadRow(entry, typeId, action, onLoaded) {
    setState(entry, '加载中…', null);
    return getJson(API_BASE + '?t=' + encodeURIComponent(typeId)).then(function (data) {
      var list = data && data.list ? data.list : null;
      if (!list) throw new Error('empty');
      renderCards(entry, list, action || openMediaItem);
      if (onLoaded) onLoaded(list);
    }).catch(function () {
      setState(entry, '加载失败。', function () { loadRow(entry, typeId, action); });
    });
  }

  /* ---------- Hero 轮播(最近更新前几张,参考 tmdb.html hero 自动轮播+交互暂停) ---------- */
  var heroItems = [];
  var heroIndex = 0;
  var heroTimer = null;
  var heroLayer = 0;   /* 0=A层显示,1=B层显示 */
  var heroEntry = null;

  function restartHeroAuto() {
    if (heroTimer) clearTimeout(heroTimer);
    heroTimer = setTimeout(function () {
      showHero(heroIndex + 1);
    }, 5200);
  }

  function showHero(index) {
    if (!heroItems.length) return;
    heroIndex = ((index % heroItems.length) + heroItems.length) % heroItems.length;
    var item = heroItems[heroIndex];
    var pic = item.vod_pic || item.pic || '';
    var nextLayer = heroLayer === 0 ? qs('hero-bg-b') : qs('hero-bg-a');
    var curLayer = heroLayer === 0 ? qs('hero-bg-a') : qs('hero-bg-b');
    if (pic) {
      nextLayer.style.backgroundImage = 'url(' + coverSrc(pic) + ')';
      nextLayer.classList.add('show');
      curLayer.classList.remove('show');
      heroLayer = heroLayer === 0 ? 1 : 0;
    }
    qs('hero-title').textContent = item.vod_name || item.title || '';
    qs('hero-remark').textContent = item.vod_remarks || item.vodRemarks || '';
    var dots = qs('hero-dots');
    clear(dots);
    for (var i = 0; i < heroItems.length; i++) {
      dots.appendChild(el('span', i === heroIndex ? 'dot on' : 'dot'));
    }
    restartHeroAuto();
  }

  function buildHero(list) {
    heroItems = list.slice(0, 4);
    if (!heroItems.length) return;
    qs('hero').style.display = '';
    /* hero 按钮注册为第 0 行(在继续观看之前),遥控器可聚焦、Enter 打开 */
    var hero = qs('hero');
    heroEntry = { element: hero, state: { style: {} }, cards: [], rowEl: hero, isHero: true };
    var btn = qs('hero-btn');
    var currentItem = function () { return heroItems[heroIndex]; };
    btn.onclick = function () {
      restartHeroAuto();
      var item = currentItem();
      if (!item) return;
      var id = String(item.vod_id || item.id || '');
      if (id.indexOf('msub:') === 0) openMediaItem(item);
      else openBoardDetail(item);
    };
    heroEntry.cards = [btn];
    registerFocusable(btn, heroEntry, 0);
    rowRegistry.unshift(heroEntry);
    showHero(0);
  }

  /* 服务端播放记录(每剧最新一条):页面自带 pt 直连 /api/playback/changes,
   * 同源 fetch+请求头 —— 桥/SDK 全不可用时继续观看也必有数据(双保险的另一路) */
  function serverHistory() {
    if (!ptok) return Promise.resolve([]);
    return fetch(SERVER + '/api/playback/changes', {
      headers: { 'X-PlaySync-Token': ptok, 'X-PlaySync-Latest': 'true', 'X-PlaySync-Limit': '20' }
    }).then(function (r) { return r.json(); }).then(function (page) {
      var items = page && page.items ? page.items : [];
      var out = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (!it.sourceKey || !it.vodId) continue;
        out.push({
          siteKey: it.sourceKey, vodId: it.vodId,
          key: it.sourceKey + '@@@' + it.vodId + '@@@0',
          vodName: it.vodName, vodPic: it.vodPic, vodRemarks: it.episodeName
        });
      }
      return out;
    });
  }

  function loadHistory(entry) {
    var viaFm = (fm && fm.history)
      ? fm.history().catch(function () { return null; })
      : Promise.resolve(null);
    return viaFm.then(function (list) {
      if (list && list.length) { renderCards(entry, list.slice(0, 20), openHistory); return; }
      return serverHistory().then(function (items) {
        if (items && items.length) { renderCards(entry, items.slice(0, 20), openHistory); }
        else { setState(entry, null); }
      });
    }).catch(function () { setState(entry, null); });
  }

  function loadBoardCategories() {
    return getJson(API_BASE).then(function (data) {
      var cats = data && data.class ? data.class : [];
      var douban = [];
      var tmdb = [];
      for (var i = 0; i < cats.length; i++) {
        var tid = String(cats[i].type_id || '');
        if (tid.indexOf('douban:') === 0) douban.push(cats[i]);
        else if (tid.indexOf('tmdb:') === 0) tmdb.push(cats[i]);
      }
      /* 豆瓣榜单前 4 + TMDB 精选榜单(趋势/热门/高分/正在播出),榜单卡片走网页详情而非原生播放 */
      var tmdbOrder = ['tmdb:trending', 'tmdb:tv_popular', 'tmdb:tv_top_rated', 'tmdb:tv_on_the_air'];
      var tmdbPicked = [];
      for (var t = 0; t < tmdbOrder.length; t++) {
        for (var d2 = 0; d2 < tmdb.length; d2++) {
          if (tmdb[d2].type_id === tmdbOrder[t]) { tmdbPicked.push(tmdb[d2]); break; }
        }
      }
      return douban.slice(0, 4).concat(tmdbPicked);
    }).catch(function () { return []; });
  }

  function loadBoard(board) {
    var entry = buildRow(board.type_name || '片单', null, null);
    return loadRow(entry, board.type_id, openBoardDetail);
  }

  var booted = false;
  var contEntry = null;  /* 继续观看行:fmsdk 晚到竞态时补拉用 */
  function boot() {
    /* window.fm 已就绪与 fmsdk 事件可能双双触发,重复 boot 会把所有行/榜单建两遍 */
    if (booted) return;
    booted = true;
    if (native && fm && fm.ui && fm.ui.setChrome) {
      try {
        fm.ui.setChrome({ mode: 'edge', statusBarStyle: 'light', restoreAffordance: 'auto' });
      } catch (e) { }
    }
    /* 固定行:最近更新 / 连载中 / 已完结(与 csp_Media「我的追剧」分类同口径) */
    var recent = buildRow('最近更新', null, null);
    var active = buildRow('连载中', null, null);
    var ended = buildRow('已完结', null, null);
    /* 继续观看行插在最前(依赖 fm.history) */
    var cont = buildRow('继续观看', null, null);
    contEntry = cont;
    rowsBox.insertBefore(cont.rowEl, rowsBox.firstChild);
    rowRegistry.splice(rowRegistry.indexOf(cont), 1);
    rowRegistry.unshift(cont);

    loadRow(recent, 'recent', null, buildHero);
    loadRow(active, 'active');
    loadRow(ended, 'ended');
    loadHistory(cont);

    loadBoardCategories().then(function (boards) {
      var chain = Promise.resolve();
      boards.forEach(function (board) {
        chain = chain.then(function () { return loadBoard(board); });
      });
      return chain;
    }).then(function () {
      if (!current) focusFirst();
    });
  }

  /* ---------- SDK 就绪 ---------- */
  function ensureFm() {
    if (window.fm) { fm = window.fm; boot(); return; }
    window.addEventListener('fmsdk', function () {
      fm = window.fm;
      if (!booted) { boot(); return; }
      /* 慢加载竞态:600ms 降级 boot 已跑过而 fm 后到(sdk 在 onPageFinished 注入,
       * 慢 WebView/慢网络下晚于降级定时器),继续观看行当时因无 fm 被跳过 —— fm 就绪补拉 */
      if (contEntry && !contEntry.cards.length) { loadHistory(contEntry); }
    });
    /* 非 App 环境直接渲染(浏览器预览) */
    setTimeout(function () {
      if (!window.fm && !native) { boot(); }
    }, 600);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ensureFm);
  } else {
    ensureFm();
  }
})();
</script>
</body>
</html>
